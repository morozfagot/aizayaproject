# ============================================================
# docker-compose.yml — VPS (Германия)
# Сервисы: Qdrant + WireGuard VPN Server
# -----------------------------------------------------------
# Этот файл разворачивается на VPS, НЕ локально!
# Локально на ноутбуке: docker-compose.yml для Qdrant (тоже самый файл, но без wireguard)
# ============================================================

services:
  # ----------------------------------------------------------
  # Qdrant — векторная база данных
  # Порт: 6333 (HTTP API), 6334 (gRPC)
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - aizaya-network

